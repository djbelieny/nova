# Nova logrotate configuration (Linux)
#
# Install:  sudo cp setup/logrotate.conf /etc/logrotate.d/nova
# Verify:   sudo logrotate -f /etc/logrotate.d/nova
#
# Rotates all *.log files under /var/log/nova/ daily,
# keeping 7 compressed archives with date-stamped suffixes.

/var/log/nova/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    dateext
    dateformat -%Y%m%d
}
