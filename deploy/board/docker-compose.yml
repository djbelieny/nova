# Self-hosted Executive Board backend — a drop-in, wire-compatible replacement for
# the supabase.com PostgREST endpoint that src/exec-comms.ts talks to.
#
#   postgres   : applies supabase/migrations/001_executive_board.sql on first boot
#                (10 tables + RPC + triggers). Not exposed to the host.
#   postgrest  : serves the PostgREST HTTP API over that schema. Internal only.
#   board-proxy: nginx that maps /rest/v1/* -> PostgREST root (Supabase path shim).
#                THIS is the only port published. Point Nova's BOARD_DB_URL at it.
#
# Bring up + smoke test with:  bash deploy/board/setup.sh
# Config (passwords, JWT secret, BOARD_DB_KEY) lives in deploy/board/.env (gitignored),
# generated by setup.sh from deploy/board/.env.example.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/board/.env}
      POSTGRES_DB: ${POSTGRES_DB:-nova_board}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?set in deploy/board/.env}
    volumes:
      - board_pgdata:/var/lib/postgresql/data
      # init runs alphabetically: 00-roles.sh -> 01-run-migration.sh -> 02-grants.sql.
      # The migration is mounted outside the initdb dir (nested bind mounts break on
      # Docker Desktop virtiofs); 01-run-migration.sh applies it via psql -f.
      - ./init:/docker-entrypoint-initdb.d
      - ../../supabase/migrations/001_executive_board.sql:/migrations/001_executive_board.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova_board}"]
      interval: 3s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set in deploy/board/.env}@postgres:5432/${POSTGRES_DB:-nova_board}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: nova_board_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set in deploy/board/.env}
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_POOL: "10"
    depends_on:
      postgres:
        condition: service_healthy

  board-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BOARD_PROXY_PORT:-3005}:80"
    depends_on:
      - postgrest

volumes:
  board_pgdata:
