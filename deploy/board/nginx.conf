# Wire-compat shim: exec-comms.ts prefixes every request with /rest/v1/ (a Supabase
# gateway convention). Bare PostgREST serves tables/RPC at the root, so we strip the
# prefix here. This keeps src/exec-comms.ts byte-identical against self-hosted PostgREST.
server {
  listen 80;

  # Lightweight liveness probe for setup.sh (no DB round-trip).
  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # /rest/v1/<table>            -> PostgREST /<table>
  # /rest/v1/rpc/<fn>           -> PostgREST /rpc/<fn>
  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://postgrest:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Authorization / apikey / Prefer / Accept-Profile are forwarded by default.
  }
}
