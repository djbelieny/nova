services:
  nova:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ~/.claude:/root/.claude          # Claude Code auth tokens
      - nova-data:/app/.nova             # Persistent data (WhatsApp auth, uploads, temp)
    ports:
      - "3034:3034"                      # Mini App (if enabled)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nova-data:
