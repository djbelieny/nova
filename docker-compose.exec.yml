version: "3.9"
# Executive Board Overlay — 7 AI executive services
# Usage: docker-compose -f docker-compose.yml -f docker-compose.exec.yml up -d
# Each role reads from its own .env.{role} file (create from .env.{role}.example)

services:
  exec-ceo:
    build: .
    command: bun run src/executive-node.ts --role ceo
    restart: unless-stopped
    env_file:
      - .env
      - .env.ceo
    environment:
      - NOVA_DATA_DIR=/data
      - NOVA_WORKSPACE=/workspace
      - NOVA_DIR=/workspace
      - MEMWRIGHT_URL=http://memwright:8765
    volumes:
      - nova_data:/data
      - nova_workspace:/workspace
    depends_on: [relay, memwright]

  exec-cfo:
    build: .
    command: bun run src/executive-node.ts --role cfo
    restart: unless-stopped
    env_file:
