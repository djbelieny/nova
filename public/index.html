<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Your Personal AI Assistant</title>
<style>
  :root {
    --bg: #1a1a2e;
    --text: #ffffff;
    --hint: #999999;
    --accent: #6ab2f2;
    --btn: #5288c1;
    --btn-text: #ffffff;
    --secondary-bg: #0f0f23;
    --section-bg: #1e1e3a;
    --destructive: #ff4444;
    --card-radius: 14px;
    --success: #2ecc71;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    height: 4px;
    background: var(--accent);
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 40px 20px 60px;
  }

  .logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 8px;
  }

  .logo span { color: var(--accent); }

  .tagline {
    text-align: center;
    color: var(--hint);
    font-size: 14px;
    margin-bottom: 36px;
  }

  .card {
    background: var(--section-bg);
    border-radius: var(--card-radius);
    padding: 24px 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--hint);
    margin-bottom: 20px;
  }

  .field-group { margin-bottom: 16px; }

  .field-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--hint);
    margin-bottom: 6px;
    display: block;
  }

  .field-input {
    width: 100%;
    background: var(--secondary-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .field-input:focus { border-color: var(--accent); }

  .field-input::placeholder { color: rgba(255,255,255,0.25); }

  textarea.field-input {
    resize: vertical;
    min-height: 80px;
  }

  .optional-tag {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    text-transform: none;
    letter-spacing: 0;
    margin-left: 4px;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--success);
    color: var(--btn-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
  }

  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:active { transform: scale(0.98); }

  .wa-icon {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  .footer {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    margin-top: 24px;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .error-msg {
    color: var(--destructive);
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }

  .field-input.invalid {
    border-color: var(--destructive);
  }
</style>
</head>
<body>

<div class="top-bar"></div>

<div class="container">
  <div class="logo">NOVA<span>:</span></div>
  <p class="tagline">Your personal AI assistant — let's talk about building yours.</p>

  <form id="lead-form" class="card" novalidate>
    <div class="card-title">Get in touch</div>

    <div class="field-group">
      <label class="field-label" for="name">Name</label>
      <input class="field-input" type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
      <div class="error-msg" id="name-error">Please enter your name</div>
    </div>

    <div class="field-group">
      <label class="field-label" for="email">Email</label>
      <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      <div class="error-msg" id="email-error">Please enter a valid email</div>
    </div>

    <div class="field-group">
      <label class="field-label" for="message">Message <span class="optional-tag">(optional)</span></label>
      <textarea class="field-input" id="message" name="message" placeholder="Tell us about your project or what you're looking for..."></textarea>
    </div>

    <button type="submit" class="submit-btn">
      <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Chat on WhatsApp
    </button>
  </form>

  <p class="footer">Powered by Claude &nbsp;|&nbsp; Built by <a href="https://youtube.com/@GodaGo" target="_blank">GodaGo</a></p>
</div>

<script>
  const form = document.getElementById('lead-form');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const messageInput = document.getElementById('message');

  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function clearError(input, errorId) {
    input.classList.remove('invalid');
    document.getElementById(errorId).style.display = 'none';
  }

  function showError(input, errorId) {
    input.classList.add('invalid');
    document.getElementById(errorId).style.display = 'block';
  }

  nameInput.addEventListener('input', () => clearError(nameInput, 'name-error'));
  emailInput.addEventListener('input', () => clearError(emailInput, 'email-error'));

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    let valid = true;

    if (!nameInput.value.trim()) {
      showError(nameInput, 'name-error');
      valid = false;
    }

    if (!emailInput.value.trim() || !validateEmail(emailInput.value.trim())) {
      showError(emailInput, 'email-error');
      valid = false;
    }

    if (!valid) return;

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const msg = messageInput.value.trim();

    let text = `Hi! I'm ${name} (${email}).`;
    if (msg) text += ` ${msg}`;

    const waUrl = `https://wa.me/18636047056?text=${encodeURIComponent(text)}`;
    window.open(waUrl, '_blank');
  });
</script>

</body>
</html>
